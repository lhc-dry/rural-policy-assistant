services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rural
      POSTGRES_PASSWORD: rural
      POSTGRES_DB: rural_policy
    ports: ["5432:5432"]
    volumes:
      - "rural-postgres:/var/lib/postgresql/data"
      - "./server/prisma/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rural -d rural_policy"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://rural:rural@postgres:5432/rural_policy
      REDIS_URL: redis://redis:6379
      FILE_STORAGE_DIR: /data/uploads
      PORT: 4000
      SESSION_SECRET: change-me-in-production
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["4000:4000"]
    volumes: ["./server/data/uploads:/data/uploads"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_API_TARGET: http://api:4000
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://rural:rural@postgres:5432/rural_policy
      REDIS_URL: redis://redis:6379
      FILE_STORAGE_DIR: /data/uploads
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
    volumes: ["./server/data/uploads:/data/uploads"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  rural-postgres:
